<style>
  /* Layout: fixed flow-field canvas behind a single readable column: title, group, members, activities. */
  :root {
    --bg: #0a0e1a;
    --bg-rgb: 10, 14, 26;
    --fg: #eaeef7;
    --muted: #a3aec6;
    --accent: #7fe0c8;
    --line: rgba(234, 238, 247, 0.22);
    --panel: rgba(10, 14, 26, 0.62);
    --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--display);
    overflow-x: hidden;
  }
  #field {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .wrap {
    position: relative;
    max-width: 880px;
    margin-inline: auto;
    padding-inline: 20px;
    padding-block: 56px 40px;
    display: flex;
    flex-direction: column;
    gap: 44px;
  }
  .kicker {
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 14px;
  }
  h1 {
    font-size: clamp(3rem, 11vw, 7rem);
    line-height: 0.94;
    letter-spacing: -0.035em;
    font-weight: 700;
    margin: 0 0 18px;
    text-wrap: balance;
  }
  .sub {
    font-size: clamp(1.1rem, 2.6vw, 1.4rem);
    color: var(--fg);
    margin: 0;
    text-shadow: 0 1px 18px rgba(var(--bg-rgb), 0.9);
  }
  h2 {
    font-family: var(--mono);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .members {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 12px;
  }
  .members li {
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    font-size: 1.1rem;
    font-weight: 500;
    line-height: 1.3;
    overflow-wrap: anywhere;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .activity {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .activity h3 {
    font-family: var(--mono);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px;
  }
  .activity h4 {
    font-size: clamp(1.8rem, 6vw, 2.6rem);
    letter-spacing: 0.02em;
    line-height: 1;
    margin: 0 0 12px;
  }
  .activity p {
    margin: 0;
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.5;
  }
  .shot { margin: 18px 0 0; }
  .shot img { display: block; width: 100%; height: auto; max-width: 100%; border-radius: 10px; border: 1px solid var(--line); }
  .acts { display: flex; flex-direction: column; }
  .acts h2 { margin-bottom: 16px; }
  .acts .activity + .activity { margin-top: 16px; }
  .btn {
    display: inline-flex;
    align-items: center;
    margin-top: 18px;
    font: 500 0.82rem/1 var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--bg);
    background: var(--accent);
    border-radius: 999px;
    padding: 13px 20px;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }
  .group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  button {
    font: 500 0.78rem/1 var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 11px 16px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: inline-flex;
    align-items: center;
    gap: 9px;
    transition: border-color 0.2s, color 0.2s;
  }
  button:hover { border-color: var(--fg); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
</style>

<script>
(function () {
  var canvas = document.getElementById("field");
  var ctx = canvas.getContext("2d");
  var toggle = document.getElementById("toggle");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var PALETTES = [
    ["#7fe0c8", "#4cc3e0", "#9be8a8", "#3b8fd9"],
    ["#ff9a5c", "#ffd166", "#ff6b6b", "#f7b2ad"],
    ["#b79cff", "#7aa2ff", "#f09bd8", "#8be3ff"]
  ];
  var BG = "10,14,26";
  var w = 0, h = 0, dpr = 1, particles = [], t = 0, running = !reduce, raf = 0, paletteIndex = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "rgb(" + BG + ")";
    ctx.fillRect(0, 0, w, h);
    var n = Math.max(160, Math.min(900, Math.floor((w * h) / 1900)));
    particles = [];
    for (var i = 0; i < n; i++) particles.push(spawn(true));
  }
  function spawn(anywhere) {
    return {
      x: Math.random() * w, y: Math.random() * h,
      life: anywhere ? Math.random() * 200 : 0,
      max: 160 + Math.random() * 240,
      c: Math.floor(Math.random() * 4),
      s: 0.7 + Math.random() * 1.1
    };
  }
  function angle(x, y, time) {
    var k = 0.0028;
    return (Math.sin(x * k + time) + Math.cos(y * k * 1.35 - time * 0.8) +
            Math.sin((x + y) * k * 0.6 + time * 0.5)) * 1.7;
  }
  function step() {
    ctx.fillStyle = "rgba(" + BG + ",0.07)";
    ctx.fillRect(0, 0, w, h);
    var pal = PALETTES[paletteIndex];
    ctx.lineWidth = 1.3;
    ctx.globalAlpha = 0.8;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var a = angle(p.x, p.y, t);
      var nx = p.x + Math.cos(a) * p.s;
      var ny = p.y + Math.sin(a) * p.s;
      ctx.strokeStyle = pal[p.c];
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(nx, ny);
      ctx.stroke();
      p.x = nx; p.y = ny; p.life++;
      if (p.life > p.max || nx < -10 || ny < -10 || nx > w + 10 || ny > h + 10) particles[i] = spawn(false);
    }
    ctx.globalAlpha = 1;
    t += 0.0035;
  }
  function loop() { if (!running) return; step(); raf = requestAnimationFrame(loop); }
  function setRunning(on) {
    running = on;
    toggle.textContent = on ? "Pause" : "Play";
    toggle.setAttribute("aria-pressed", on ? "false" : "true");
    cancelAnimationFrame(raf);
    if (on) raf = requestAnimationFrame(loop);
  }
  function paintStill() { for (var i = 0; i < 260; i++) step(); }

  document.getElementById("palettes").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-p]");
    if (!b) return;
    paletteIndex = Number(b.getAttribute("data-p"));
    var all = this.querySelectorAll("button");
    for (var i = 0; i < all.length; i++) all[i].setAttribute("aria-pressed", all[i] === b ? "true" : "false");
    ctx.fillStyle = "rgb(" + BG + ")";
    ctx.fillRect(0, 0, w, h);
    if (!running) paintStill();
  });
  toggle.addEventListener("click", function () { setRunning(!running); });

  var rt;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () { resize(); if (!running) paintStill(); }, 150);
  });

  resize();
  if (reduce) { toggle.textContent = "Play"; toggle.setAttribute("aria-pressed", "true"); paintStill(); }
  else setRunning(true);
})();
</script>
